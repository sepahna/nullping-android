plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ir.nullping.android'
version = '0.2.0'

android {
  namespace "expo.modules.nullpingvpn"
  defaultConfig {
    minSdkVersion 24
  }
}

// Compile against the generated Java bindings without making this library
// module embed a local AAR inside its own AAR. The full AAR is added to the
// application module by the Android build workflow.
dependencies {
  compileOnly files('libs/libv2ray-classes.jar')
}
