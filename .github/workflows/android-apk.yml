name: Android Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop/**'
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'modules/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Xray core Android library
        run: |
          git clone https://github.com/2dust/AndroidLibXrayLite.git "$RUNNER_TEMP/AndroidLibXrayLite"
          cd "$RUNNER_TEMP/AndroidLibXrayLite"
          git checkout b5a377087e74eaa34e86718710b04c50f4b767f5
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          gomobile init
          mkdir -p "$GITHUB_WORKSPACE/modules/nullping-vpn/android/libs"
          gomobile bind -v -androidapi 24 -trimpath -ldflags="-s -w -buildid= -checklinkname=0" -o "$GITHUB_WORKSPACE/modules/nullping-vpn/android/libs/libv2ray.aar" .

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare universal APK
        run: |
          mkdir -p dist
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" dist/universal.apk
          sha256sum dist/universal.apk | tee dist/universal.apk.sha256
          ls -lh dist/universal.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: null-ping-universal-apk
          path: |
            dist/universal.apk
            dist/universal.apk.sha256
          if-no-files-found: error
          retention-days: 14
