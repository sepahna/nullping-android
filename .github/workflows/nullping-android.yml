name: Null Ping Android APK

on:
  push:
    branches:
      - feature/client-import-model
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nullping-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build Null Ping APK (upstream v2rayNG)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Null Ping build configuration
        uses: actions/checkout@v4

      - name: Checkout pinned v2rayNG source and submodules
        env:
          UPSTREAM_SHA: 141059d98402bb353400a42fce9d2ec8447cd70f
        run: |
          git clone https://github.com/2dust/v2rayNG.git upstream
          git -C upstream checkout "$UPSTREAM_SHA"
          git -C upstream submodule sync --recursive
          git -C upstream submodule update --init --recursive
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Apply Null Ping branding
        run: |
          python3 scripts/brand_upstream.py upstream
          grep -n 'name="app_name"' upstream/V2rayNG/app/src/main/res/values/strings.xml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build HEV native libraries
        working-directory: upstream
        run: |
          chmod +x compile-hevtun.sh
          ./compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Fetch matching Xray AAR
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          mkdir -p V2rayNG/app/libs
          gh release download "$CURRENT_TAG"             --repo 2dust/AndroidLibXrayLite             --pattern libv2ray.aar             --dir V2rayNG/app/libs
          test -s V2rayNG/app/libs/libv2ray.aar

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run upstream unit tests
        working-directory: upstream/V2rayNG
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:testPlaystoreDebugUnitTest --no-daemon

      - name: Assemble APK
        working-directory: upstream/V2rayNG
        run: ./gradlew :app:assemblePlaystoreDebug --no-daemon

      - name: Verify APK output
        working-directory: upstream/V2rayNG
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NullPing-Android-debug-APK
          path: upstream/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NullPing-build-metadata
          path: |
            upstream/.gitmodules
            upstream/V2rayNG/app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 7
